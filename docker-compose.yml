# CoreKG 本地开发完整编排：中间件 + 聚合服务 corekg + pipeline worker。
# 用法：
#   docker compose build          # 先构建 corekg / pipeline 镜像
#   docker compose up -d
#   docker compose ps
#
# 生产环境请勿使用本文件；所有凭据均为本地开发默认值，私有化部署请通过 Helm values 覆盖。
#
# 说明：
#   - 为规避宿主机上可能已占用的默认端口，宿主机端口在容器默认端口基础上统一 +2：
#       MySQL 3308(:3306)  Redis 6381(:6379)  ES 9202(:9200)/9302(:9300)
#       MinIO 9002(:9000)/9003(:9001)  NATS 4225(:4222)  Nebula 9669(:9669)
#       corekg 8080(:8080)  frontend 3001(:80)
#   - 所有中间件明文密码统一为 123456（本地开发默认值）。
#   - 容器之间通过服务名+容器内端口互连；宿主机进程经映射端口访问。
#   - 首次启动时会通过 scripts/mysql-docker-init.sh 额外创建 opencoze 库。
#   - 所有中间件镜像统一使用 yygu 自建镜像（registry.cn-beijing.aliyuncs.com/yygu/corekg 与
#     registry.yygu.cn/library），与私有化 Helm 部署（corekg-chart）同一套镜像；corekg/pipeline/
#     ketask 等业务镜像仍本地构建。ES 镜像已内置 IK 分词插件，无需额外 es-init 容器。
#   - keinit 为一次性基础设施初始化服务（建表/ES 索引/MinIO bucket+coze 静态资源/系统设置/模型）。
#     coze-static-loader 先把 minio-init 镜像内的 coze 静态资源（default_icon 等）落到 coze_static 卷，
#     供 keinit 上传到 MinIO opencoze bucket（workflow 即 coze）。两者均不会随 up 自动重复执行：
#       docker compose up keinit   # 依赖就绪后手动触发初始化（跑完退出）
#
# 服务名（容器内端口）：
#   mysql:3306  elasticsearch:9200  minio:9000  nats:4222  redis:6379
#   nebula：metad0:9559  storaged0:9779  graphd:9669（单节点 Nebula，3 容器）
#   corekg:8080  frontend:80  chunker（chunk worker）  analyser（doc worker）
#   doc2pdf（PDF 预览）  description（file_description 摘要 worker）
#   coze-static-loader  keinit（一次性初始化）
#
# ---------- Nebula Graph（图数据库）----------
#   - 单节点 Nebula 由三个容器组成（vesoft 官方镜像一律一个进程一个镜像，无内置 all-in-one）：
#       metad0:9559  storaged0:9779  graphd:9669；ws_http 分别 19559/19779/19669。
#   - corekg 通过 ENABLE_NEBULA_GRAPH=true 启用图功能；DB settings（knowledge/nebula）里的
#     address 指向 graphd（graphd:9669），由 keinit 的 core_setting.yaml 下发。
#   - 首次初始化必须激活 storaged（否则 CREATE SPACE 报 Host not enough）：由 nebula-activator
#     一次性执行 ADD HOSTS "storaged0":9779。
#   - 知识图谱的 space 由应用按"ke_graph_"+20位随机串自动创建，无需手动预建。
#   - 宿主进程连图库走 graphd 映射端口 9669。
#
# pipeline worker 的 LLM/Embedding/MinerU 地址在以下文件里配置（默认指向占位，请按你的真实环境填写）：
#   apps/pipeline/config/chunk_config.docker.yaml   # chunker：LLM/VLLM/Embedding/ES/Work
#   apps/pipeline/config/analyser_config.docker.yaml # analyser：s3/analyser_api_url (MinerU)/api_url

services:
  mysql:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:mysql_8.4.5
    container_name: corekg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: corekg
      MYSQL_USER: corekg
      MYSQL_PASSWORD: 123456
      MYSQL_EXTRA_DATABASES: opencoze
    ports:
      - "3308:3306"
    volumes:
      - ./scripts/mysql-docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucorekg", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:elasticsearch_8.18.1-2
    container_name: corekg-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: 123456
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ports:
      - "9202:9200"
      - "9302:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:123456 http://127.0.0.1:9200/_cluster/health | grep -qE 'yellow|green'"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:redis_8.2
    container_name: corekg-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:minio_RELEASE.2025-04-22T22-12-26Z
    container_name: corekg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 初始化：创建 corekg-bucket（docker 模式 workflow 关闭，bucket 需显式创建）。
  # 复用 minio 内置的 mc 客户端，避免额外拉取 minio/mc 镜像。
  minio-init:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:minio_RELEASE.2025-04-22T22-12-26Z
    container_name: corekg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minio123456 &&
      mc mb --ignore-existing local/corekg-bucket &&
      echo 'MinIO bucket corekg-bucket ready'
      "
    restart: "no"

  # coze 静态资源装载：把 minio-init 镜像内的 /app/scripts/minio（workflow 即 coze 的默认图标等资源）
  # 落到 coze_static 命名卷，供 keinit 初始化时上传到 MinIO opencoze bucket。
  # 一次性执行（restart: no），仅在 coze_static 卷为空时真正拷贝。
  coze-static-loader:
    image: registry.yygu.cn/library/minio-init:v0.1.2
    container_name: corekg-coze-static-loader
    command: ["sh", "-c", "if [ -z \"$(ls -A /scripts)\" ]; then cp -rf /app/scripts/minio/. /scripts/ && echo 'coze static resources loaded'; else echo 'coze static resources already present, skip'; fi"]
    volumes:
      - coze_static:/scripts
    restart: "no"

  # keinit：一次性基础设施初始化（MySQL 建表 / ES 索引 / MinIO bucket+coze 静态资源 / 系统设置 / 聊天模型 / API Key）。
  # 依赖就绪后手动触发一次，跑完退出；不会随 docker compose up 自动重复执行。
  #   docker compose up -d             # 先起依赖（mysql/es/redis/minio/nats/nebula/corekg 等）
  #   docker compose up keinit         # 初始化并退出
  keinit:
    build:
      context: .
      dockerfile: apps/keinit/script/Dockerfile
    image: keinit:latest
    container_name: corekg-keinit
    command: ["-c", "/app/config/config.yaml", "--setting-file", "/app/config/core_setting.yaml"]
    env_file:
      - ./apps/keinit/conf/docker/kinit.env
    volumes:
      - ./apps/keinit/conf/docker/config.yaml:/app/config/config.yaml:ro
      - ./apps/keinit/conf/docker/core_setting.yaml:/app/config/core_setting.yaml:ro
      - coze_static:/app/scripts/minio:ro
      - keinit_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      coze-static-loader:
        condition: service_completed_successfully
    restart: "no"

  nats:
    image: registry.yygu.cn/library/nats:2.12.7
    container_name: corekg-nats
    restart: unless-stopped
    command: ["-js"]   # 用默认入口 + 显式启用 JetStream（workflow 依赖）；避免用镜像 config 触发的 cluster 模式
    ports:
      - "4225:4222"

  # ---------- Nebula Graph（图数据库，单节点 3 容器：metad + storaged + graphd） ----------
  # 数据卷统一挂到 nebula_data 下，各自子目录 meta/storage；graphd 无本地数据。
  metad0:
    image: registry.yygu.cn/library/nebula-metad:v3.8.0
    container_name: corekg-nebula-metad
    restart: unless-stopped
    environment:
      USER: root
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=metad0
      - --ws_ip=metad0
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --logtostderr=true
      - --redirect_stdout=false
      - --v=0
      - --minloglevel=0
    ports:
      - "9559:9559"
    volumes:
      - nebula_data:/data
    cap_add:
      - SYS_PTRACE
    healthcheck:
      # 镜像内无 curl；HTTP 服务绑定在容器 IP(metad0)而非 127.0.0.1，故用 bash /dev/tcp 探测 ws 状态端点。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/metad0/19559; printf \"GET /status HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3; cat <&3' 2>/dev/null | grep -q running"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  storaged0:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:nebula-storaged_v3.8.0
    container_name: corekg-nebula-storaged
    restart: unless-stopped
    environment:
      USER: root
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=storaged0
      - --ws_ip=storaged0
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --logtostderr=true
      - --redirect_stdout=false
      - --v=0
      - --minloglevel=0
    depends_on:
      metad0:
        condition: service_started
    ports:
      - "9779:9779"
    volumes:
      - nebula_data:/data
    cap_add:
      - SYS_PTRACE
    healthcheck:
      # 镜像内无 curl；storaged HTTP 服务绑定在容器 IP(storaged0)而非 127.0.0.1。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/storaged0/19779; printf \"GET /status HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3; cat <&3' 2>/dev/null | grep -q running"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  graphd:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:nebula-graphd_v3.8.0
    container_name: corekg-nebula-graphd
    restart: unless-stopped
    environment:
      USER: root
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
      - --ws_http_port=19669
      - --logtostderr=true
      - --redirect_stdout=false
      - --v=0
      - --minloglevel=0
    depends_on:
      storaged0:
        condition: service_started
    ports:
      - "9669:9669"       # graphd thrift（宿主 9669，与 keinit core_setting.yaml 的 graphd:9669 对齐）
    volumes:
      - nebula_data:/data
    cap_add:
      - SYS_PTRACE
    healthcheck:
      # 镜像内无 curl；graphd HTTP 服务绑定在容器 IP(graphd)而非 127.0.0.1。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/graphd/19669; printf \"GET /status HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3; cat <&3' 2>/dev/null | grep -q running"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Nebula storaged 激活：单节点首次启动需把 storaged0 加入 hosts，否则 CREATE SPACE 报 Host not enough。
  # 幂等 ADD HOSTS；带重试循环（storaged 就绪可能需要数次）。使用独立的 nebula-console 镜像
  # （nebula server 镜像未内置 console 二进制）。
  nebula-activator:
    image: registry.cn-beijing.aliyuncs.com/yygu/corekg:nebula-console_v3.8.0
    container_name: corekg-nebula-activator
    depends_on:
      metad0:
        condition: service_healthy
      storaged0:
        condition: service_started
      graphd:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        CLI=nebula-console
        for i in $$(seq 1 30); do
          if $$CLI -addr graphd -port 9669 -u root -p nebula -e 'ADD HOSTS "storaged0":9779' >/dev/null 2>&1; then
            echo "Nebula storaged activated."
            exit 0
          fi
          echo "waiting for storaged ready, attempt $$i/30"
          sleep 5
        done
        echo "Failed to activate storaged after 30 attempts."
        exit 1
    restart: "no"

  # ---------- corekg（聚合服务：kecore + kechat + account + keapi + keparser + kesearch） ----------
  corekg:
    build:
      context: .
      dockerfile: apps/corekg/script/Dockerfile
    image: corekg:latest
    container_name: corekg
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      ENABLE_NEBULA_GRAPH: "true"
      NATS_URL: nats://nats:4222   # 指向本编排内 nats 服务；必需，否则 initNATS/task 桥接与 SaveTask 派发失败
    command: ["-c", "/data/config.yaml"]
    ports:
      - "8080:8080"
    volumes:
      - ./apps/corekg/conf/docker/config.yaml:/data/config.yaml:ro
      - corekg_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_started
      graphd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---------- CoreKG 前端（Nginx 静态站点 + CoreKG/MinIO 同源代理） ----------
  frontend:
    build:
      context: ./frontend/corekg
      dockerfile: Dockerfile.prod
    image: corekg-frontend:latest
    container_name: corekg-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      corekg:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------- pipeline：chunk 切块 worker ----------
  chunker:
    build:
      context: apps/pipeline
      dockerfile: Dockerfile
    image: corekg-pipeline:latest
    container_name: corekg-pipeline-chunker
    command: ["python", "chunk_worker_main.py"]
    volumes:
      - ./apps/pipeline/config/chunk_config.docker.yaml:/app/config/chunk_config.yaml:ro
      - pipeline_logs:/app/logs
    depends_on:
      corekg:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ---------- pipeline：文档解析 worker（S3 下载 → MinerU 转 Markdown → 上传回 S3） ----------
  analyser:
    image: corekg-pipeline:latest
    container_name: corekg-pipeline-analyser
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    command: ["python", "doc_worker_main.py"]
    volumes:
      - ./apps/pipeline/config/analyser_config.docker.yaml:/app/config/analyser_config.yaml:ro
      - pipeline_logs:/app/logs
    depends_on:
      corekg:
        condition: service_healthy

  # ---------- doc2pdf / copy worker（ketask 二进制：docx/ppt/ofd → PDF 预览） ----------
  doc2pdf:
    build:
      context: .
      dockerfile: apps/ketask/script/Dockerfile
    image: corekg-keask:latest
    container_name: corekg-keask-doc2pdf
    command: ["doc2pdf", "-c", "/data/config.yaml", "-t", "ke.doc_to_pdf_task", "-b", "http://corekg:8080/", "-r", "1"]
    volumes:
      - ./apps/ketask/conf/docker/config.yaml:/data/config.yaml:ro
      - corekg_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      corekg:
        condition: service_healthy

  # ---------- description worker（ketask 二进制：生成 file_description/摘要写 ES） ----------
  description:
    image: corekg-keask:latest
    container_name: corekg-keask-description
    command: ["description", "-c", "/data/config.yaml", "-t", "ke.description_task", "-b", "http://corekg:8080/", "-r", "1"]
    volumes:
      - ./apps/ketask/conf/docker/config.yaml:/data/config.yaml:ro
      - corekg_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      corekg:
        condition: service_healthy

volumes:
  mysql_data:
  es_data:
  redis_data:
  minio_data:
  nebula_data:
  corekg_data:
  coze_static:
  keinit_logs:
  pipeline_logs:
