profile: enterprise
capabilities:
  knowledge: true
  chat: true
  search: true
  graph: true
  ocr: true
  video: false
  writing: true
  mcp: true
  billing: true
  external_datasource: true
infra:
  db:
    driver: postgres
    dsn: postgres://corekg:corekg@127.0.0.1:5432/corekg?sslmode=disable
  vector:
    driver: elasticsearch
    addr: http://127.0.0.1:9200
