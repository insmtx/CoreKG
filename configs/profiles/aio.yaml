    driver: pgvector
  keyword:
    driver: postgres_fts
  object:
    driver: localdir
    root: ./data/objects
  cache:
    driver: redis
    addr: 127.0.0.1:6379
  lock:
    driver: redis
    addr: 127.0.0.1:6379
  stream:
    driver: redis
    addr: 127.0.0.1:6379
  queue:
    driver: db
  embedding:
    driver: http
    url: http://127.0.0.1:11434/v1/embeddings
  rerank:
    driver: none
  llm:
    driver: http
    url: http://127.0.0.1:11434/v1
  parser:
    driver: local
  graph:
    driver: none
