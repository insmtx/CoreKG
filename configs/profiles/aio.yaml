profile: aio
capabilities:
  knowledge: true
  chat: true
  search: true
  graph: false
  ocr: false
  video: false
  writing: false
  mcp: true
  billing: false
  external_datasource: false
infra:
  db:
    driver: postgres
    dsn: postgres://corekg:corekg@127.0.0.1:5432/corekg?sslmode=disable
