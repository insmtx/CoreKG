name: Mirror to git.yygu.cn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release*'
    tags:
      - '*'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        env:
          YYGU_TOKEN: ${{ secrets.YYGU_TOKEN }}
        run: |
          echo "::group::configure mirror remote"
          git remote add mirror "https://oauth2:${YYGU_TOKEN}@git.yygu.cn/corekg/corekg.git"
          echo "::endgroup::"

          echo "[0/4] fetching all branches & tags from origin ..."
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "  exit=$?"

          BRANCHES="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin | wc -l | tr -d ' ')"
          TAGS="$(git tag | wc -l | tr -d ' ')"
          echo "  origin branches=${BRANCHES}, tags=${TAGS}"

          echo "[1/4] pushing all branches ..."
          timeout 900 git push --force mirror 'refs/remotes/origin/*:refs/heads/*'; echo "  exit=$?"

          echo "[2/4] pushing all tags ..."
          timeout 900 git push --force --tags mirror; echo "  exit=$?"

          echo "[3/4] pruning branches removed upstream ..."
          timeout 900 git push --force mirror --prune 'refs/remotes/origin/*:refs/heads/*'; echo "  exit=$?"
